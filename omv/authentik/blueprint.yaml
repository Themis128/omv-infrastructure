# authentik blueprint — cloudless.gr platform (applied via `ak apply_blueprint` / API)
# Reference: https://docs.goauthentik.io/customize/blueprints/
version: 1
metadata:
  name: cloudless-platform
  labels:
    managed-by: omv-infrastructure

entries:
  # --- Groups -------------------------------------------------------
  - model: authentik_core.group
    identifiers:
      name: cloudless-admins
    id: group-cloudless-admins
    attrs:
      name: cloudless-admins
      is_superuser: true
  - model: authentik_core.group
    identifiers:
      name: cloudless-users
    id: group-cloudless-users
    attrs: {name: cloudless-users}
  - model: authentik_core.group
    identifiers:
      name: social-users
    id: group-social-users
    attrs: {name: social-users}
  - model: authentik_core.group
    identifiers:
      name: nextcloud-users
    id: group-nextcloud-users
    attrs: {name: nextcloud-users}

  # --- Property mapping: expose groups claim ------------------------
  - model: authentik_providers_oauth2.scopemapping
    identifiers:
      scope_name: groups
    id: scope-groups
    attrs:
      name: groups
      scope_name: groups
      expression: |
        return {"groups": [g.name for g in user.ak_groups.all()]}

  # --- SocialAuto OIDC provider (existing client social_client) -----
  - model: authentik_providers_oauth2.oauth2provider
    identifiers:
      client_id: social_client
    id: provider-social
    attrs:
      name: socialauto
      client_type: confidential
      client_id: social_client
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-invalidation-flow]]
      property_mappings: [!Find [authentik_providers_oauth2.scopemapping, [scope_name, groups]]]
      redirect_uris:
        - {matching_mode: strict, url: https://social.cloudless.gr/auth/callback}
        - {matching_mode: strict, url: http://localhost:8083/auth/callback}

  # --- cloudless.gr portal ------------------------------------------
  - model: authentik_providers_oauth2.oauth2provider
    identifiers:
      name: cloudless-portal
    id: provider-portal
    attrs:
      name: cloudless-portal
      client_type: public
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-invalidation-flow]]
      property_mappings: [!Find [authentik_providers_oauth2.scopemapping, [scope_name, groups]]]
      redirect_uris:
        - {matching_mode: strict, url: https://cloudless.gr/api/auth/callback}

  # --- Nextcloud (user_oidc app) ------------------------------------
  - model: authentik_providers_oauth2.oauth2provider
    identifiers:
      name: nextcloud
    id: provider-nextcloud
    attrs:
      name: nextcloud
      client_type: confidential
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-invalidation-flow]]
      property_mappings: [!Find [authentik_providers_oauth2.scopemapping, [scope_name, groups]]]
      redirect_uris:
        - {matching_mode: strict, url: https://cloud.cloudless.gr/apps/user_oidc/code}

  # --- Applications --------------------------------------------------
  - model: authentik_core.application
    identifiers:
      slug: social-oidc
    id: app-social
    attrs: {name: SocialAuto, slug: social-oidc, provider: !Find [authentik_providers_oauth2.oauth2provider, [name, socialauto]], group: Work}
  - model: authentik_core.application
    identifiers:
      slug: cloudless-portal
    id: app-portal
    attrs: {name: cloudless.gr Portal, slug: cloudless-portal, provider: !Find [authentik_providers_oauth2.oauth2provider, [name, cloudless-portal]], group: Web}
  - model: authentik_core.application
    identifiers:
      slug: nextcloud
    id: app-nextcloud
    attrs: {name: Nextcloud, slug: nextcloud, provider: !Find [authentik_providers_oauth2.oauth2provider, [name, nextcloud]], group: Files}

# TODO before apply:
# - generate real client secrets (authentik API) -> secret store, never here
# - confirm exact redirect URI paths per app (Auth.js, user_oidc, social-api)
# - enrollment flow for cloudless-users once portal auth lands
# - MFA policy binding: default-authentication-flow -> TOTP+WebAuthn for cloudless-admins
